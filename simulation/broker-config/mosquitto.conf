# Broker untuk simulasi. Node publish lewat injector, collector subscribe langsung.
listener 1884 127.0.0.1
allow_anonymous true

# Tanpa persistence supaya tiap run mulai bersih
persistence false

# Jangan batasi antrean/inflight di broker, supaya pembatas hanya dari injector
max_inflight_messages 0
max_queued_messages 0

# Log secukupnya (log ke stdout memperlambat kalau terlalu verbose)
log_dest stdout
log_type error
log_type warning
